name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (lint, typecheck, tests con Postgres y Redis, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: encuanto
          POSTGRES_PASSWORD: encuanto
          POSTGRES_DB: encuanto
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U encuanto -d encuanto"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      DATABASE_URL: postgres://encuanto:encuanto@localhost:5432/encuanto
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      # Criterio de H2: p95 de /api/search < 150 ms con 50.000 ofertas sintéticas.
      - run: pnpm bench:search
      - run: pnpm build

  windows:
    name: Windows (lint, typecheck, tests unitarios y build)
    runs-on: windows-latest
    timeout-minutes: 20
    # Sin Postgres ni Redis: los tests de integración se omiten aquí y corren en el job de Linux.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
